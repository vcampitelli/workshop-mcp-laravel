<svg xmlns="http://www.w3.org/2000/svg" width="990" height="292" viewBox="90 83 990 292" role="img" aria-labelledby="title desc">
  <title id="title">MCP: aplicações de IA, fontes de dados e ferramentas</title>
  <desc id="desc">O protocolo padronizado MCP conecta aplicações de IA a fontes de dados e ferramentas por meio de um fluxo bidirecional de dados.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 0 L 7 5 L 1 10" fill="none" stroke="#999" stroke-width="1.3"/>
    </marker>
  </defs>
  <g class="fragment" id="applications">
    <rect class="box" fill="#fff" stroke="#444" stroke-width="1" x="91" y="84" width="228" height="77" rx="5"/>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="heading" font-size="17" font-weight="700" x="205" y="118">Interface de chat</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="detail" font-size="16" x="205" y="140">Claude Desktop, LibreChat</text>
    <rect class="box" fill="#fff" stroke="#444" stroke-width="1" x="91" y="177" width="228" height="77" rx="5"/>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="heading" font-size="17" font-weight="700" x="205" y="211">IDEs e editores de código</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="detail" font-size="16" x="205" y="233">Claude Code, Goose</text>
    <rect class="box" fill="#fff" stroke="#444" stroke-width="1" x="91" y="270" width="228" height="77" rx="5"/>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="heading" font-size="17" font-weight="700" x="205" y="304">Outras aplicações de IA</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="detail" font-size="16" x="205" y="326">5ire, Superinterface</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="caption" font-size="12" x="205" y="371">Aplicações de IA</text>
  </g>
  <g class="fragment" id="sources-and-tools">
    <rect class="box" fill="#fff" stroke="#444" stroke-width="1" x="779" y="84" width="300" height="77" rx="5"/>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="heading" font-size="17" font-weight="700" x="929" y="118">Dados e sistemas de arquivos</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="detail" font-size="16" x="929" y="140">PostgreSQL, SQLite, GDrive</text>
    <rect class="box" fill="#fff" stroke="#444" stroke-width="1" x="779" y="177" width="300" height="77" rx="5"/>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="heading" x="929" y="211" font-size="17" font-weight="700">Ferramentas de desenvolvimento</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="detail" font-size="16" x="929" y="233">Git, Sentry, etc.</text>
    <rect class="box" fill="#fff" stroke="#444" stroke-width="1" x="779" y="270" width="300" height="77" rx="5"/>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="heading" x="929" y="304" font-size="17" font-weight="700">Ferramentas de produtividade</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="detail" font-size="16" x="929" y="326">Slack, Google Maps, etc.</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="caption" font-size="12" x="929" y="371">Fontes de dados e ferramentas</text>
  </g>
  <g class="fragment" id="mcp-and-connections">
    <path class="connection" fill="none" stroke="#999" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M 319 122.5 H 352 Q 365 122.5 365 135.5 V 157.5 Q 365 170.5 378 170.5 H 425"/>
    <path class="connection" fill="none" stroke="#999" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M 319 215.5 H 425"/>
    <path class="connection" fill="none" stroke="#999" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M 319 308.5 H 352 Q 365 308.5 365 295.5 V 273.5 Q 365 260.5 378 260.5 H 425"/>
    <path class="connection" fill="none" stroke="#999" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M 672 170.5 H 719 Q 732 170.5 732 157.5 V 135.5 Q 732 122.5 745 122.5 H 779"/>
    <path class="connection" fill="none" stroke="#999" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M 672 215.5 H 779"/>
    <path class="connection" fill="none" stroke="#999" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M 672 260.5 H 719 Q 732 260.5 732 273.5 V 295.5 Q 732 308.5 745 308.5 H 779"/>
    <rect x="425" y="147.5" width="247" height="135.5" rx="5" fill="#e2eefa" stroke="#4b87d6" stroke-width="1.2"/>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="heading" font-size="17" font-weight="700" x="548.5" y="211">MCP</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="detail" font-size="16" x="548.5" y="233">Protocolo padronizado</text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="caption" font-size="12" x="372" y="333"><tspan x="372">Fluxo bidirecional</tspan><tspan x="372" dy="14">de dados</tspan></text>
    <text fill="#111" font-family="Geist, Arial, Helvetica, sans-serif" text-anchor="middle" class="caption" font-size="12" x="726" y="333"><tspan x="726">Fluxo bidirecional</tspan><tspan x="726" dy="14">de dados</tspan></text>
  </g>
</svg>
